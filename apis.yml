apis:
- name: Ledger Wallet API
  description: >-
    Bi-directional JSON-RPC 2.0 interface between a Live App (dApp) and a wallet implementing the Wallet
    API Server, such as Ledger Wallet. Currency-agnostic modules for accounts, currencies, transactions,
    message signing, storage, exchange and device access, distributed as @ledgerhq/wallet-api-client,
    -core, -server, -client-react and -simulator.
  humanURL: >-
    https://developers.ledger.com/docs/ledger-live/discover/integration/wallet-api/introduction
  tags:
  - Blockchain
  - digital-assets
  - self-custody
  tags_raw:
  - blockchain
  - digital-assets
  - self-custody
  properties:
  - type: Documentation
    url: >-
      https://developers.ledger.com/docs/ledger-live/discover/integration/wallet-api/introduction
  - type: APIReference
    url: >-
      https://developers.ledger.com/docs/ledger-live/discover/integration/wallet-api/core/modules/wallet
  - type: Sandbox
    url: >-
      https://developers.ledger.com/docs/ledger-live/discover/integration/wallet-api/simulator/introduction
  - type: SourceCode
    url: https://github.com/LedgerHQ/wallet-api
  x-transport-note: >-
    JSON-RPC 2.0 over a message-port transport, not REST. No OpenAPI is published for it and none was
    authored; the TypeScript client packages are the machine-readable surface.
- name: Ledger Device Management Kit
  description: >-
    TypeScript SDK for discovering, connecting to and driving Ledger hardware signers over WebHID, Bluetooth,
    USB and Speculos — sessions, device state, app management, APDU exchange and chain-specific signer
    kits for Ethereum, Bitcoin and Solana. Supersedes the deprecated LedgerJS hw-app-* / hw-transport-*
    packages.
  humanURL: https://developers.ledger.com/docs/device-interaction/getting-started
  tags:
  - hardware-wallet
  - Security
