aid: ledger
name: Ledger
description: >-
  Ledger SAS is the Paris-headquartered maker of the Ledger hardware signer family (Nano, Flex,
  Stax) and the surrounding self-custody and institutional-custody platform. Its developer surface
  spans five distinct programs: the Ledger Wallet exchange-provider APIs (Swap, Buy, Sell, Earn and
  Card OpenAPI contracts an exchange partner implements so its service appears natively inside
  Ledger Wallet), the Ledger Enterprise "Vault API" for institutional custody — accounts,
  transactions, governance requests, whitelists, entities, staking, compliance digests and
  reporting/notification webhooks — the Ledger Enterprise Multisig transaction service for
  Ledger-secured Safe smart accounts, the Wallet API (a bi-directional JSON-RPC 2.0 bridge that lets
  a Live App talk to a Ledger signer), and the Device Management Kit plus Clear Signing stack for
  building native device apps and clear-signed transactions. Ledger also publishes an unusually
  complete agent surface for a hardware company: an RFC 9727 /.well-known/api-catalog, an llms.txt
  on the developer portal, and first-party Agent Skills for coding agents and the Ledger Wallet CLI.
url: https://raw.githubusercontent.com/api-evangelist/ledger/refs/heads/main/apis.yml
