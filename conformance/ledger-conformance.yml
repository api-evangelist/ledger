standards:
  - id: openapi-3
    conforms: true
    evidence: >-
      Seven documents published — five OpenAPI 3.0.3/3.1.0 exchange-provider contracts advertised via
      /.well-known/api-catalog, the Vault API at OpenAPI 3.0.2, and the multisig service at 3.1.0.
  - id: rfc9727-api-catalog
    conforms: true
    evidence: >-
      https://developers.ledger.com/.well-known/api-catalog returns a valid linkset with
      service-desc, service-doc and service-meta relations for five APIs. Rare in this sector and one
      of the strongest discovery signals in the whole Ledger estate.
  - id: llms-txt
    conforms: true
    evidence: >-
      Three distinct llms.txt files served — developers.ledger.com/llms.txt,
      help.enterprise.ledger.com/llms.txt and help.multisig.ledger.com/llms.txt — plus per-page
      Markdown twins reachable by appending .md to any docs URL.
  - id: agent-skills
    conforms: true
    evidence: >-
      Four first-party Agent Skills published at github.com/LedgerHQ/agent-skills with SKILL.md
      frontmatter, installable via `npx skills add ledgerhq/agent-skills`. Since wallet-cli 2.1.0 the
      skill ships embedded in the binary with `wallet-cli skill install` and `skill doctor`.
  - id: oauth2
    conforms: false
    evidence: >-
      No oauth2 securityScheme in any of the seven specs. Authentication is header API keys plus, on
      the Vault API, a bearer token minted by POST /auth/token.
  - id: oidc
    conforms: false
    evidence: No openIdConnect scheme and no /.well-known/openid-configuration on any host (404).
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      No application/problem+json anywhere. Three bespoke envelopes coexist — see
      errors/ledger-problem-types.yml.
  - id: rfc9116-security-txt
    conforms: false
    evidence: >-
      No /.well-known/security.txt on any Ledger-controlled host. The 200 on status.ledger.com is
      Atlassian's, not Ledger's. The disclosure programme is real but web-page-only at
      donjon.ledger.com/bounty/.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: >-
      No Sunset or Deprecation headers, and 0 of 108 operations carry `deprecated: true`, despite a
      publicly announced September 2026 LedgerJS removal.
  - id: rfc6749-idempotency-key
    conforms: false
    evidence: >-
      No Idempotency-Key header on any write surface. Idempotency is natural-key and refusal-based
