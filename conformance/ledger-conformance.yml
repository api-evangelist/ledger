  - id: a2a-agent-card
    conforms: false
    evidence: /.well-known/agent-card.json and /.well-known/agent.json 404 on all eight probed hosts.
  - id: mcp
    conforms: false
    evidence: >-
      No hosted or packaged MCP server. Ledger's multisig CLI guide instead instructs the reader to
