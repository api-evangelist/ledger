domain_standards:
  - id: erc-4337-account-abstraction
    conforms: true
    evidence: >-
      The multisig contract exposes a first-class 4337 surface — /tx-service/eth/api/v1/safe-operations/
      with UserOperationWithSafeOperationResponse and SafeOperationResponse schemas carrying
      entryPoint, callGasLimit, verificationGasLimit, preVerificationGas, maxFeePerGas,
      maxPriorityFeePerGas, paymaster and paymasterData. A caller who already speaks ERC-4337
      integrates with no bespoke connector.
    spec_location: openapi/ledger-enterprise-multisig-openapi.yml#/components/schemas/UserOperationWithSafeOperationResponse
  - id: safe-transaction-service-api
    conforms: true
    evidence: >-
      The Ledger Enterprise Multisig API is wire-compatible with the open-source Safe Transaction
      Service (info.title "Safe Transaction Service" 5.33.1; the live service reports 5.42.1 at
      /v1/about/). Ledger states the compatibility as a feature - "if you are familiar with the Safe
      API you will find our endpoints and data structures virtually identical" - so any Safe SDK
      (@safe-global/api-kit) works against the Ledger host by changing txServiceUrl only.
    spec_location: openapi/ledger-enterprise-multisig-openapi.yml#/info/title
  - id: erc-20
    conforms: true
    evidence: >-
      ERC-20 is a first-class entity in the Vault API, not an afterthought — GET
      /accounts/{parent_account_id}/erc20-children-accounts, GET /currencies/{currency_name}/tokens/{contract_address},
      and an ERC20_ACCOUNT payload type in the notification catalogue.
    spec_location: openapi/ledger-enterprise-vault-openapi.yml
  - id: erc-721-collectibles
    conforms: true
    evidence: >-
      NFT surface on both platforms — GET /accounts/{account_id}/nfts, /nft-collections and
      /nft-portfolio on the Vault API, and SafeCollectibleResponse (ERC-721) on the multisig service.
    spec_location: openapi/ledger-enterprise-vault-openapi.yml
  - id: erc-4626-vaults
    conforms: true
    evidence: >-
      The Ledger Wallet CLI documents earn support for ERC-4626 vaults on Ethereum/EVM alongside
      native Solana staking.
    spec_location: https://developers.ledger.com/docs/ai-tools/ledger-cli
  - id: eip-712-typed-data
    conforms: true
    evidence: >-
      EIP-712 typed-data signing is a named capability of the Ethereum device app and the signer
      kits; the September 2026 breaking change is specifically the removal of the hashed
      (blind-signing) variant signEIP712HashedMessage.
    spec_location: https://developers.ledger.com/docs/news
  - id: eip-155-evm-chains
    conforms: true
    evidence: >-
      The multisig service is keyed on numeric chain id — base URL
      https://app.multisig.ledger.com/api/safe-transaction-service/{chainId} with Ethereum (1),
      Optimism (10), BSC (56), Polygon (137), Base (8453), Arbitrum (42161) and Sepolia (11155111)
      documented.
    spec_location: https://help.multisig.ledger.com/guides/api-guides/1.-querying-safe-data
  - id: bip-32-44-derivation
    conforms: true
    evidence: >-
      HD key derivation and derivation paths are core DMK concepts, documented in the device-app
