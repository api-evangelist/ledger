    spec_location: https://help.enterprise.ledger.com/core/compliance-capabilities/proof-of-reserve-enable-message-signing-on-an-account
  - id: fido2-webauthn
    conforms: true
    evidence: >-
      Ledger devices act as FIDO2/WebAuthn security keys (app-security-key, in scope for the bug
