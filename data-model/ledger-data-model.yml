method: derived
source: openapi/ledger-enterprise-vault-openapi.yml ($ref graph + *_id reference fields)
note: Derived from the Ledger Enterprise (Vault) API, the only Ledger contract with a rich object model
  — 269 schemas across 85 operations. The exchange-provider contracts are stateless request/response shapes
  (quote, swap, sell payload) with no persistent entity graph, and the multisig service reuses the upstream
  Safe object model (Safe, MultisigTransaction, Delegate, Owner, Module, SafeOperation), so neither is
  modelled here.
root_domain: 'institutional digital-asset custody: a WORKSPACE contains ACCOUNTS, and every state-changing
  action on one is a REQUEST that must reach a governance QUORUM before the HSM signs it.'
entity_count: 268
relationship_count: 152
core_entities:
- name: Account
  domain: custody
  note: A per-currency custody account with its own governance rules, addresses, balances, labels, tokens,
    NFTs and ERC-20 child accounts.
  endpoints:
  - GET /accounts
  - GET /accounts/{account_id}
  - GET /accounts/{account_id}/balances
  - GET /accounts/{account_id}/addresses
  - GET /accounts/{parent_account_id}/erc20-children-accounts
- name: Transaction
  domain: movement
  note: A crypto transfer, staking action or smart-contract interaction. Created through a Request; rejectable
    only while pending approval.
  endpoints:
  - GET /transactions
  - GET /transactions/{transaction_id}
  - POST /transactions/{transaction_id}/reject
  - POST /transactions/estimate-fees
- name: Request
  domain: governance
  note: The quorum-gated envelope around every critical action — create/edit an account, group, whitelist,
    user invitation or transaction. Carries a challenge for device approval.
  endpoints:
  - GET /requests
  - POST /requests
  - POST /requests/{request_id}/approve
  - POST /requests/{request_id}/reject
  - GET /requests/{request_id}/challenge
  - GET /requests/{request_id}/governance-status
- name: User
  domain: identity
  note: Administrator, Operator or API Operator, each holding a Personal Security Device.
  endpoints:
  - GET /users
  - GET /users/{user_id}
  - GET /users/{user_id}/history
- name: Group
  domain: identity
  note: A named set of Operators referenced by account governance rules.
  endpoints:
  - GET /groups
  - GET /groups/{group_id}
- name: Entity
  domain: organisation
  note: An organisational grouping of accounts, with its own users.
  endpoints:
  - GET /entities
  - GET /entities/{entity_id}
  - GET /entities/{entity_id}/users
- name: Whitelist
  domain: controls
  note: Approved destination addresses; a transaction rule can require the destination be on one.
  endpoints:
  - GET /whitelists
  - GET /whitelists/{whitelist_id}
- name: Settlement
  domain: tradelink
  note: A TradeLink settlement with a liquidity provider; cancellable only in FAILED_TO_BROADCAST, recoverable
    only in SUBMITTED.
  endpoints:
  - GET /settlements
  - POST /settlements
  - POST /settlements/{settlement_id}/cancel
  - POST /settlements/{settlement_id}/recover
- name: Digest
  domain: compliance
  note: Compliance digest records, alongside address-risk and sanctions screening.
  endpoints:
  - GET /digests
  - GET /digests/{digests_id}
  - GET /compliance/address-risk/{address}
  - GET /compliance/sanctions/{address}
- name: Pledge
  domain: staking
  note: A staking pledge; per-chain stake and reward views exist for Ethereum, Solana, Cardano and Tezos.
  endpoints:
  - GET /pledges
  - GET /pledges/{pledge_id}
  - GET /ethereum/accounts/{account_id}/stakes
- name: Message
  domain: signing
  note: Off-chain message signing, including Proof of Reserve.
  endpoints:
  - GET /messages
  - GET /messages/{message_id}
- name: Webhook
  domain: events
  note: Notification target (url + shared secret) registered per API user.
  endpoints:
  - GET /notifications/configuration
  - PUT /notifications/configuration
history_pattern: Eight entities expose a parallel /history sub-resource — accounts, transactions, digests,
  entities, groups, messages, users and whitelists — giving a uniform audit trail per object. This is
  the estate's strongest data-model convention.
id_conventions:
  style: integer surrogate ids in path segments (account_id, transaction_id, request_id, ...)
  note: No prefixed string ids. Webhook payloads carry only {payload_type, event_type, id}, so the id
    plus payload_type is the join key back into the API.
