format_note: 'No Ledger API uses RFC 9457 application/problem+json. Three different error envelopes coexist:
  the Vault API returns {"code": <int>, "message": <string>}; the multisig service returns CodeErrorResponse
  {"code", "message", "arguments"[]}; the exchange buy contract returns text/plain for its 400s while
  sell/card/earn return application/json. Adopting RFC 9457 across the estate is the cheapest error-semantics
  win available.'
