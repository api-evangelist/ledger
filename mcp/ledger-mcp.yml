search_result: >-
  NO MCP server exists — hosted or packaged. Probed npm for @ledgerhq/mcp-server, @ledgerhq/mcp and
  ledger-mcp (all {"error":"Not found"}), and found no mcp.* host in the estate. Ledger's own
  documentation confirms the absence and pushes the work onto the integrator: the multisig agent
  guide says "Write a thin MCP server (one tool per `lem` subcommand, or a single 'run lem' tool
  that accepts an args array. Both work)" and "wrapped in your MCP framework of choice."
  This is a deliberate posture, not an oversight — Ledger has invested heavily in the ADJACENT agent
  surfaces (four published Agent Skills, three CLIs with JSON-by-default output and stable exit
  codes, an embedded skill installer, an llms.txt on every docs host) while leaving MCP itself to the
  integrator. An agent cannot reach Ledger over MCP today; it reaches it by shelling out to a CLI.
  NO MCPServer pointer is emitted in apis.yml, because emitting one would credit Ledger with an
  agent surface it does not serve.
candidate_note: >-
