note: >-
  Ledger publishes NO MCP server, so there is no live tools/list to bind against. What Ledger does
  publish is three CLIs with stable JSON output and four Agent Skills, plus seven OpenAPI documents.
  This crosswalk therefore binds the CANDIDATE tool set in mcp/ledger-mcp.yml — the tools an
  integrator would build following Ledger's own instruction to "write a thin MCP server" — to the
  real backing operations, and records where the CLI surface and the REST surface diverge. Confidence
  is high throughout because each row maps to a named operationId or a documented CLI command, but
  every row is a candidate binding, not a published one.
