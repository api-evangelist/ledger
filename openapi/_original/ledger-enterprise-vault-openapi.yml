openapi: 3.0.2
info:
  title: Vault API
  version: 1.35.0
  x-logo:
    url: https://www.ledger.com/wp-content/themes/ledger-v2/public/images/ledger-logo-long.svg
  description: '

    # Authentication


    The Ledger Vault API offers several methods of authentication.

    Depending on your LAM configuration you''ll require several of the following headers

    to process API calls. Please refer to the

    [help center](https://help.vault.ledger.com/Content/api/api_overview.html) for
    more details.


    The `X-Ledger-API-User` header is required for all API calls to LAM

    (except when you register

    [API users on LAM](https://help.vault.ledger.com/Content/api/api_apiusers.html)).


    Note that the `X-Ledger-API-Key` authorization header can be used alongside the

    `X-Ledger-Store-Auth-Token` if both a LAM API key and HashiCorp Vault have

    been set up on your LAM.

    In this case, for every call made to LAM,

    you''ll need to pass all three headers

    `X-Ledger-API-User`, `X-Ledger-API-Key`, and `X-Ledger-Store-Auth-Token`.

    '
security:
- Ledger_API_User: []
- Ledger_API_User: []
  Ledger_API_Key: []
- Ledger_API_User: []
  Ledger_Store_Auth_Token: []
- Ledger_API_User: []
  Ledger_API_Key: []
  Ledger_Store_Auth_Token: []
tags:
- description: "The notification feature allows you to be notified when an API user\n\
    receives an important event.\n\nTo receive a webhook notification, you must first\
    \ register your\ntarget endpoint via `PUT /notifications/configuration`\n\nOnce\
    \ done, your web server will be called via POST with a json payload\nsuch as this\
    \ one:\n```\n {'payload_type': 'TRANSACTION', 'event_type': 'NEW_TRANSACTION_HAS_BEEN_RECEIVED',\
    \ 'id': 10}\n```\n\n- `payload_type`: Enum identifying the type of the Vault object\
    \ the notification is about.\n- `event_type`: Enum identifying uniquely the exact\
    \ event that triggered the notification.\nCan be used to run specific actions\
    \ for specific events.\n- `id`: Id of the Vault object. Together with `payload_type`\
    \ they allow you to fetch the full\nobject with the corresponding endpoint.\n\n\
    Below is a list and short description of the event types API operators can receive:\n\
    \n| Event Type | Payload Type | Description |\n|------------|--------------|-------------|\n\
    | NEW_TRANSACTION_HAS_BEEN_SIGNED | TRANSACTION | A new transaction has been signed\
    \ by the HSM |\n| NEW_TRANSACTION_HAS_BEEN_BROADCASTED | TRANSACTION | An new\
    \ transaction has been broadcast |\n| NEW_TRANSACTION_HAS_FAILED | TRANSACTION\
    \ | A new transaction has failed upon broadcast |\n| NEW_TRANSACTION_HAS_BEEN_ABORTED\
    \ | TRANSACTION | A new transaction has been aborted by a User |\n| NEW_TRANSACTION_HAS_BEEN_RECEIVED\
    \ | TRANSACTION | A new transaction has been received |\n| NEW_TRANSACTION_HAS_BEEN_SCORED\
    \ | TRANSACTION | A new transaction has been scored by a KYT provider |\n| REQUEST_HAS_BEEN_CREATED\
    \ | REQUEST | A new request has been created |\n| REQUEST_HAS_RECEIVED_AN_APPROVAL\
    \ | REQUEST | A request has received an approval |\n| REQUEST_HAS_REACHED_STEP\
    \ | REQUEST | A request has reached a new approval step |\n| REQUEST_HAS_REACHED_QUORUM\
    \ | REQUEST | A request has reached the required quorum |\n| REQUEST_HAS_BEEN_ABORTED\
    \ | REQUEST | A request has been aborted |\n| REQUEST_HAS_EXPIRED | REQUEST |\
    \ A request has been pending for too long and has expired |\n| NEW_USER_HAS_BEEN_CREATED\
    \ | USER | A new user  has been created |\n| USER_HAS_BEEN_EDITED | USER | A user\
    \ has been edited |\n| USER_HAS_BEEN_REVOKED | USER | A user has been revoked\
    \ |\n| USER_HAS_BEEN_SUSPENDED | USER | A user has been suspended |\n| USER_HAS_BEEN_UNSUSPENDED\
    \ | USER | A user has been unsuspended |\n| NEW_GROUP_HAS_BEEN_CREATED | GROUP\
    \ | A new group  has been created |\n| GROUP_HAS_BEEN_EDITED | GROUP | A group\
    \ has been edited |\n| GROUP_HAS_BEEN_REVOKED | GROUP | A group has been revoked\
    \ |\n| NEW_ACCOUNT_HAS_BEEN_CREATED | X_ACCOUNT | A new account has been created\
    \ |\n| ACCOUNT_HAS_BEEN_EDITED | X_ACCOUNT | An account has been edited |\n| NEW_ENTITY_HAS_BEEN_CREATED\
    \ | ENTITY | A new entity has been created |\n| ENTITY_HAS_BEEN_EDITED | ENTITY\
    \ | An entity has been edited |\n| ENTITY_HAS_BEEN_REVOKED | ENTITY | An entity\
    \ has been revoked |\n| NEW_WHITELIST_HAS_BEEN_CREATED | WHITELIST | A new whitelist\
    \ has been created |\n| WHITELIST_HAS_BEEN_EDITED | WHITELIST | A whitelist has\
    \ been edited |\n\nNote: `X_ACCOUNT` can be one of BITCOIN_ACCOUNT, ETHEREUM_ACCOUNT,\
    \ ERC20_ACCOUNT, ...\n\nBy design, we've reduced the number of information in\
    \ the payload to the minimum\nas we can't guarantee the security of the channel\
    \ the same way we do with the LAM.\n\nHowever, using the provided `id` you can\
    \ query the LAM to get more information.\n\nYou can also make sure the payload\
    \ is genuine with the shared secret you've\nprovided during registration.\nWe\
    \ send you the following HTTP Header `X-Ledger-Signature: t=<timestamp>,v1=<signature>`\n\
    \  - `timestamp` is a unix epoch timestamp\n  - `signature` is a hmac sha256 signature\
    \ computed with your secret and the\n concatenation of the:\n     - timestamp\
    \ as a string\n     - character \".\"\n     - json payload\n\nHere is an example\
    \ of signature validation and a request to the LAM using python / flask:\n```python\n\
    SECRET = \"mysecret\"\nUSER = \"api_lam_user\"\n\n\n@app.route(\"/\", methods=[\"\
    POST\"])\ndef webhook():\n    ledger_signature = request.headers[\"X-Ledger-Signature\"\
    ]\n    for elem in ledger_signature.split(\",\"):\n        k, v = elem.split(\"\
    =\")\n        if k == \"t\":\n            timestamp = v\n        elif k == \"\
    v1\":\n            signature = v\n\n    if time.time() - int(timestamp) > 5 *\
    \ 60:\n        raise ValueError(\"message is too old, possible replay attack\"\
    )\n\n    to_sign = timestamp.encode() + b\".\" + request.data\n    computed_signature\
    \ = hmac.new(SECRET.encode(), to_sign, \"sha256\").hexdigest()\n    if not hmac.compare_digest(signature,\
    \ computed_signature):\n        raise ValueError(\"signature mismatch\")\n\n \
    \   if request.json.get(\"payload_type\") == \"TRANSACTION\":\n        tx_id =\
    \ request.json[\"id\"]\n        tx = requests.get(\n            f\"http://vault-lam:5000/transactions/{tx_id}\"\
    ,\n            headers={\"X-Ledger-API-User\": USER, \"Content-Type\": \"application/json\"\
    },\n        )\n        print(tx.json())\n        # do something with the transaction\n\
    ```"
  name: Notifications
- description: "A Request represents the intent of creating or changing an object\
    \ in the system.\n\nFor example, when you create a transaction, a *Create transaction*\
    \ request is created.\n\nYou can observe all the changes in the system via `GET\
    \ /requests`.\nEvery request has a `target_type` and `target_id` that you can\
    \ use to fetch\nthe object targeted by this request.\n\nFor example, you can list\
    \ all requests waiting for approval:\n```\nGET /requests?status=PENDING_APPROVAL\n\
    {\n  \"edges\": [\n    {\n      \"cursor\": 0,\n      \"node\": {\n        \"\
    created_by\": 5,\n        \"created_on\": \"2020-09-25T13:52:38.377654+00:00\"\
    ,\n        \"expires_at\": \"2020-10-02T13:52:38.377605+00:00\",\n        \"id\"\
    : 20,\n        \"status\": \"PENDING_APPROVAL\",\n        \"target_id\": 13,\n\
    \        \"target_type\": \"USER\",\n        \"type\": \"REVOKE_USER\"\n     \
    \ }\n    },\n    {\n      \"cursor\": 1,\n      \"node\": {\n        \"created_by\"\
    : 11,\n        \"created_on\": \"2020-09-25T13:52:53.421567+00:00\",\n       \
    \ \"expires_at\": \"2020-10-02T13:52:53.421502+00:00\",\n        \"id\": 21,\n\
    \        \"status\": \"PENDING_APPROVAL\",\n        \"target_id\": 3681,\n   \
    \     \"target_type\": \"TRANSACTION\",\n        \"type\": \"CREATE_TRANSACTION\"\
    \n      }\n    }\n  ],\n  \"page_info\": {\n    \"count\": 2,\n    \"has_next_page\"\
    : false\n  }\n}\n```\nHere we have 2 requests waiting for approval. You can have\
    \ more info on\nthose 2 objects via\n```\nGET /users/13\nGET /transactions/3681\n\
    ```"
  name: Requests
- description: "When fetching or creating transactions, the `amount`, `fees` and `max_fees`\
    \ values are always expressed\nin the lowest available unit, also known as the\
    \ **base unit**: satoshi for Bitcoin, wei for Ethereum,\nmutez for Tezos, etc.\n\
    You can inspect the units available via a call to `GET /accounts/<id>/currency`.\n\
    \n> \u2139\uFE0F Token transfer transactions on Ethereum, Polygon, or other EVM\
    \ networks: the `amount`\nvalue is expressed in the ERC-20 base unit, but the\
    \ `fees` and `max_fees` values are expressed\nin the network currency used to\
    \ pay for the transaction fee (ETH for Ethereum, MATIC for Polygon, etc,)."
  name: Transactions
paths:
  /accounts:
    get:
      summary: Search accounts
      tags:
      - Accounts
      description: Use the following parameters to search accounts.
      parameters:
      - name: account_label
        in: query
        description: A list of label id to filter account by.
        required: false
        explode: true
        schema:
          default: null
          items:
            type: string
          nullable: true
          type: array
        style: form
      - name: account_type
        in: query
        description: Filters the results on the crypto asset type.
        required: false
        schema:
          default: null
          enum:
          - null
          - Bep20
          - Bitcoin
          - Cardano
          - Cosmos
          - Erc20
          - Ethereum
          - Generic
          - Near
          - Polkadot
          - Polygon
          - Ripple
          - Solana
          - Stellar
          - Tezos
          - Trc20
          - Tron
          nullable: true
          type: string
      - name: created_after
        in: query
        description: Returns objects created after the entered date.
        required: false
        schema:
          default: null
          example: '2020-09-12T14:15:22Z'
          format: date-time
          nullable: true
          type: string
      - name: created_before
        in: query
        description: Returns objects created before the entered date.
        required: false
        schema:
          default: null
          example: '2020-12-13T16:17:28Z'
          format: date-time
          nullable: true
          type: string
      - name: currency
        in: query
        description: Filters the results by the account's currency.
        required: false
        schema:
          default: null
          example: bitcoin or ethereum:0xdAC17F958D2ee523a2206206994597C13D831ec7
          nullable: true
          type: string
      - name: entity
        in: query
        description: An entity to filter account by
        required: false
        explode: true
        schema:
          default: null
          items:
            type: integer
          nullable: true
          type: array
        style: form
      - name: group
        in: query
        description: Lists accounts linked to the entered group.
        required: false
        schema:
          default: null
          nullable: true
          type: integer
      - name: id
        in: query
        description: Returns the object corresponding to the entered ID
        required: false
        schema:
          default: null
          nullable: true
          type: integer
      - name: name
        in: query
        description: Filters the list by account name.
        required: false
        schema:
          default: null
          example: hot wallet 1
          nullable: true
          type: string
      - name: order
        in: query
        description: Orders the list of results
        required: false
        schema:
          default: null
          enum:
          - null
          - asc
          - desc
          example: desc
          nullable: true
          type: string
      - name: order_by
        in: query
        description: criteria to order by
        required: false
        schema:
          default: null
          example: name
          nullable: true
          type: string
      - name: page
        in: query
        description: Defines the page number to be fetched.
        required: false
        schema:
          default: 1
          example: 3
          minimum: 1
          nullable: true
          type: integer
      - name: page_size
        in: query
        description: "Defines the number of elements displayed on a page.\n      \
          \  Must be a positive number with 0 and -1 return a maximum defined in the\
          \ gate"
        required: false
        schema:
          default: 20
          example: 40
          minimum: -1
          nullable: true
          type: integer
      - name: parent
        in: query
        description: Filters the list of results to display accounts linked to the
          entered parent account.
        required: false
        schema:
          default: null
          nullable: true
          type: integer
      - name: status
        in: query
        description: Returns objects that match the selected status.
        required: false
        schema:
          default: null
          enum:
          - null
          - ACTIVATION_ABORTED
          - ACTIVE
          - APPROVED
          - HSM_COIN_UPDATED
          - PENDING
          - PENDING_ACTIVATION
          - PENDING_CREATE_IN_HSM
          - PENDING_VIEW_ONLY
          - REJECTED
          - VIEW_ONLY
          nullable: true
          type: string
      - name: user
        in: query
        description: Filters the list to display accounts the entered user belongs
          to.
        required: false
        schema:
          default: null
          nullable: true
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_APISearchAccountResults'
          description: Account search results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid search parameter
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: This search parameter doesn't exist
  /accounts/{account_id}:
    get:
      summary: Get an account by ID
      tags:
      - Accounts
      description: This method returns the account that matches the entered ID.
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: Account object
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Account not found
  /accounts/{account_id}/address:
    get:
      summary: Get an address for a non UTXO based account
      tags:
      - Accounts
      description: 'Returns the address of an account in a JWT format.


        The JWT is built in the following format: `base64urlEncoding(header).base64urlEncoding(payload).base64urlEncoding(signature)`

        * header is an object containing: `{"alg": "ES256K, "typ": "JWT"}`

        * payload is an object containing: `{"address": ..., "derivation_path": ...,
        "blockchain_name": ...}`

        * signature is the header and payload encoded in base64 and signed with the
        private key of the leaf certificate.

        '
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                example: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiJ9.eyJhZGRyZXNzIjoiIiwiZGVyaXZhdGlvbl9wYXRoIjoiIiwiYmxvY2tjaGFpbl9uYW1lIjoiIn0.mJnLqum1TREZPPxb5BEmF3pIq6A6Z-wepwtXislPQnaAPYqYKAK40yxUgmDDNBb92OgLx0T4AcitxqudGi0Svg
                format: application/jwt
                pattern: ^([a-zA-Z0-9_=]+)\.([a-zA-Z0-9_=]+)\.([a-zA-Z0-9_\-\+\/=]+)$
                type: string
          description: 'Address data in JWT format.

            '
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No address matches
  /accounts/{account_id}/address/{index}:
    get:
      summary: Get a change or receive address by index for an UTXO account
      tags:
      - Accounts
      description: 'Returns the receiving or change address corresponding to the specified
        index in a JWT format. This functionality is available for UTXO-based currencies
        only.


        The JWT is built in the following format: `base64urlEncoding(header).base64urlEncoding(payload).base64urlEncoding(signature)`

        * header is an object containing: `{"alg": "ES256K, "typ": "JWT"}`

        * payload is an object containing: `{"address": ..., "derivation_path": ...,
        "blockchain_name": ...}`

        * signature is the header and payload encoded in base64 and signed with the
        private key of the leaf certificate.


        Change address is not supported yet.

        '
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      - name: index
        in: path
        required: true
        schema:
          type: integer
      - name: type
        in: query
        description: The type of the address.
        required: true
        schema:
          enum:
          - change
          - receive
          example: receive
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                example: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiJ9.eyJhZGRyZXNzIjoiIiwiZGVyaXZhdGlvbl9wYXRoIjoiIiwiYmxvY2tjaGFpbl9uYW1lIjoiIn0.mJnLqum1TREZPPxb5BEmF3pIq6A6Z-wepwtXislPQnaAPYqYKAK40yxUgmDDNBb92OgLx0T4AcitxqudGi0Svg
                format: application/jwt
                pattern: ^([a-zA-Z0-9_=]+)\.([a-zA-Z0-9_=]+)\.([a-zA-Z0-9_\-\+\/=]+)$
                type: string
          description: 'Address data in JWT format.

            '
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No address matches
  /accounts/{account_id}/addresses:
    get:
      summary: '[DEPRECATED] Get receiving addresses of an account'
      tags:
      - Accounts
      description: Deprecated - For UTXO-based accounts. Returns a list of the next
        3 available fresh addresses for an account. A fresh address is a newly generated
        address that has not received any previous transactions. It is recommended
        for privacy and security to use a fresh address for every transaction. On
        non UTXO-based accounts, this endpoint will return the single public address
        in use for the account.
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addresses'
          description: New address generated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Provided index invalid
  /accounts/{account_id}/addresses/{index}:
    get:
      summary: '[DEPRECATED] Get an address by index for an account'
      tags:
      - Accounts
      description: Deprecated - Returns the receiving address corresponding to the
        specified index. The index must already be used or be the next one available.
        Check the derivation path parameter number to find out how many have already
        been generated. This functionaltity is available for UTXO-based currencies
        only. On non UTXO-based accounts, this endpoint will return the single public
        address in use for the account.
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      - name: index
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Address generated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No address matches the provided index
  /accounts/{account_id}/balances:
    get:
      summary: Get an account's balances by ID
      tags:
      - Accounts
      description: This method returns the account's balances that matches the entered
        ID.
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AccountBalances'
                - $ref: '#/components/schemas/SolanaBalances'
                - $ref: '#/components/schemas/BitcoinBalances'
          description: Account object
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Account not found
  /accounts/{account_id}/balances/history:
    get:
      summary: Get an account's balances history by ID
      tags:
      - Accounts
      description: This method returns the account's balances history that matches
        the entered ID.
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      - name: end
        in: query
        description: End of the balance history time span.
        required: false
        schema:
          default: '2025-06-27T13:51:52.081391+00:00'
          format: date-time
          nullable: true
          type: string
      - name: start
        in: query
        description: Start of the balance history time span.
        required: false
        schema:
          default: '2025-06-27T13:51:52.081380+00:00'
          format: date-time
          nullable: true
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalancesHistory'
          description: Account object
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not supported for this currency
  /accounts/{account_id}/currency:
    get:
      summary: Get the account's currency
      tags:
      - Accounts
      description: "This method returns the account's currency.\n\nThe currency with\
        \ \"magnitude\" 0 is always the default unit, this\nwill be the unit used\
        \ by `GET /transactions`.\n\nFrom this point, you can deduce all the other\
        \ units.\n\nFor example, these are the units used by bitcoin accounts:\n ```\n\
        \  \"amount_units\": [\n    {\n     \"code\": \"sat\",\n     \"magnitude\"\
        : 0\n    },\n    {\n     \"code\": \"bit\",\n     \"magnitude\": 2\n    },\n\
        \    {\n     \"code\": \"mBTC\",\n     \"magnitude\": 5\n    },\n    {\n \
        \    \"code\": \"BTC\",\n     \"magnitude\": 8\n    }\n   ]\n ```\n So we\
        \ know `1BTC = 100000000sat` and `1mBTC = 100bit`, and all transactions\n\
        \ will be expressed in `sat`.\n"
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCurrency'
          description: Account currency
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Account not found
  /accounts/{account_id}/history:
    get:
      summary: Get the account's history
      tags:
      - Accounts
      description: This method returns the account's history.
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIHistoryResults'
          description: Account history
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Account not found
  /accounts/{account_id}/labels:
    get:
      summary: Get an account's labels
      tags:
      - Accounts
      description: This method returns the account's labels.
      parameters:
      - name: account_id
        in: path
        description: The account's ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
