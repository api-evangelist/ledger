    get:
      summary: Get ERC-20 Child Accounts
      tags:
      - Accounts
      description: This method lists all the ERC-20 child accounts associated with
        a parent EVM account
      parameters:
      - name: created_after
        in: query
        description: Returns objects created after the entered date.
        required: false
        schema:
          default: null
          example: '2020-09-12T14:15:22Z'
          format: date-time
          nullable: true
          type: string
      - name: created_before
        in: query
        description: Returns objects created before the entered date.
        required: false
        schema:
          default: null
          example: '2020-12-13T16:17:28Z'
          format: date-time
          nullable: true
          type: string
      - name: entity
        in: query
        description: Filters for accounts that belong to the specified entity
        required: false
        explode: true
        schema:
          default: null
          items:
            type: integer
          nullable: true
          type: array
        style: form
      - name: group
        in: query
        description: Lists accounts linked to the entered group.
        required: false
        schema:
          default: null
          nullable: true
          type: integer
      - name: id
        in: query
        description: Returns the object corresponding to the entered ID
        required: false
        schema:
          default: null
          nullable: true
          type: integer
      - name: order
        in: query
        description: Orders the list of results
        required: false
        schema:
          default: null
          enum:
          - null
          - asc
          - desc
          example: desc
          nullable: true
          type: string
      - name: order_by
        in: query
        description: criteria to order by
        required: false
        schema:
          default: null
          example: name
          nullable: true
          type: string
      - name: page
        in: query
        description: Defines the page number to be fetched.
        required: false
        schema:
          default: 1
          example: 3
          minimum: 1
          nullable: true
          type: integer
      - name: page_size
        in: query
        description: "Defines the number of elements displayed on a page.\n      \
          \  Must be a positive number with 0 and -1 return a maximum defined in the\
          \ gate"
        required: false
        schema:
          default: 20
          example: 40
          minimum: -1
          nullable: true
          type: integer
      - name: parent_account_id
        in: path
        description: The ID of the parent account
        required: true
        schema:
          type: integer
      - name: status
        in: query
        description: Returns objects that match the selected status.
        required: false
        schema:
          default: null
          enum:
          - null
          - ACTIVATION_ABORTED
          - ACTIVE
          - APPROVED
          - HSM_COIN_UPDATED
          - PENDING
          - PENDING_ACTIVATION
          - PENDING_CREATE_IN_HSM
          - PENDING_VIEW_ONLY
          - REJECTED
