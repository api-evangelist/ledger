            - SUBMITTED
            type: string
          nullable: true
          type: array
        style: form
      - name: target_id
        in: query
        description: Search by ID of the target object.
        required: false
        schema:
          default: null
          nullable: true
          type: integer
      - name: target_type
        in: query
        description: Search requests by object type.
        required: false
        explode: true
        schema:
          default: null
          items:
            enum:
            - ACCOUNT
            - ADMIN_GROUP
            - DIGESTS
            - ENTITY
            - FORCED_UNPLEDGE
            - GROUP
            - MESSAGE
            - PLEDGE_INCREMENT
            - POLICY
            - REPLEDGE
            - TRADELINK
            - TRADELINK_ASSET_MANAGER
            - TRADELINK_EXCHANGE
            - TRANSACTION
            - USER
            - WHITELIST
            type: string
          nullable: true
          type: array
        style: form
      - name: type
        in: query
        description: Search requests by request type.
        required: false
        explode: true
        schema:
          default: null
          items:
            enum:
            - ACTIVATE
            - CREATE_ACCOUNT
            - CREATE_ADMIN
            - CREATE_ADMIN_GROUP
            - CREATE_API_USER
            - CREATE_API_USER_ACCESS
            - CREATE_DAPPS_CONFIG
            - CREATE_ENTITY
            - CREATE_FORCED_UNPLEDGE
            - CREATE_GROUP
            - CREATE_OPERATOR
            - CREATE_PLEDGE_INCREMENT
            - CREATE_POLICY
            - CREATE_REPLEDGE
            - CREATE_TRADELINK
            - CREATE_TRADELINK_ASSET_MANAGER
            - CREATE_TRADELINK_EXCHANGE
            - CREATE_TRANSACTION
            - CREATE_WHITELIST
            - EDIT_ACCOUNT
            - EDIT_ADMIN_GROUP
            - EDIT_DAPPS_CONFIG
            - EDIT_ENTITY
            - EDIT_GROUP
            - EDIT_POLICY
            - EDIT_WHITELIST
            - MESSAGE_SIGNING
            - MIGRATE_ACCOUNT
            - MIGRATE_ADMIN
            - MIGRATE_GROUP
            - MIGRATE_OPERATOR
            - MIGRATE_WHITELIST
            - REVOKE_ENTITY
            - REVOKE_GROUP
            - REVOKE_USER
            - SIGN_DIGESTS
            - UPDATE_QUORUM
            type: string
          nullable: true
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_APISearchRequestResults'
          description: Request search results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid search parameters
    post:
      summary: Create Request
      tags:
      - Requests
      description: Use the following parameters to create a request.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/TransactionCreationRequestDataV2'
              - $ref: '#/components/schemas/MessageSigningRequestData'
              - $ref: '#/components/schemas/PledgeIncrementRequestData'
              - $ref: '#/components/schemas/ForcedUnpledgeRequestData'
