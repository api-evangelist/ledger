          description: Address of the anonymous proxy
          type:
          - string
          - 'null'
        is_nominator:
          description: True if the account is an active nominator, false if it is "chilled"
          type: boolean
        legacy_staking:
          description: If true, this account uses the legacy staking flow with a PureProxy account
          type: boolean
        proxies:
          description: Addresses of proxies of the controller account
          items:
            type: string
          type: array
        rewards_destination:
          default: null
          description: Rewards destination
          type:
          - string
          - 'null'
      required:
      - is_nominator
      - legacy_staking
      - proxies
      type: object
