          - dash
          - digibyte
          - dogecoin
          - ethereum
          - ethereum_classic
          - ethereum_goerli
          - ethereum_holesky
          - ethereum_hoodi
          - ethereum_pow
          - ethereum_ropsten
          - ethereum_sepolia
          - etherlink
          - fantom
          - fantom_testnet
          - filecoin
          - filecoin_calibration
          - flare
          - flare_coston
          - kava_evm
          - kava_evm_testnet
          - klaytn
          - klaytn_baobab
          - komodo
          - linea
          - litecoin
          - mantle
          - mantle_sepolia
          - near
          - neon_evm
          - optimism
          - optimism_goerli
          - optimism_sepolia
          - pivx
          - polkadot
          - polygon
          - polygon_amoy
          - polygon_mumbai
          - polygon_zk_evm
          - polygon_zk_evm_testnet
          - pulsechain
          - pulsechain_testnet
          - ripple
          - scroll
          - scroll_sepolia
          - solana
          - solana_devnet
          - solana_testnet
          - sonic
          - stellar
          - tezos
          - tomo
          - tomo_testnet
          - tron
          - vertcoin
          - viacoin
          - westend
          example: bitcoin
          type: string
        num_confirmation_needed:
          type: integer
        type:
          enum:
          - CRYPTO
          - FIAT
          example: CRYPTO
          type: string
        units:
          items:
            $ref: '#/components/schemas/CurrencyUnit'
          type: array
      required:
      - name
      - num_confirmation_needed
      - type
      - units
      type: object
    CryptoCurrencyType:
      oneOf:
      - $ref: '#/components/schemas/Coin'
      - $ref: '#/components/schemas/Token_2'
    Token_2:
      type: string
    Coin:
      type: string
    CryptoCurrencies:
      required:
      - id
      - type
      - blockchain
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/CryptoCurrencyType'
        blockchain:
          type: string
        chainId:
          type: integer
          format: int32
        contract:
          type: string
  securitySchemes:
    Ledger_API_User:
      description: (**required**) Username of a registered API User
      in: header
      name: X-Ledger-API-User
      type: apiKey
    Ledger_API_Key:
      description: If you've set up your API Key when initializing your LAM, you'll need to include it as a header along with the api user header. For more details, [see step 5 of the get started documentation](https://help.vault.ledger.com/Content/api/api_getstarted.html).
      in: header
      name: X-Ledger-API-Key
      type: apiKey
    Ledger_Store_Auth_Token:
      description: If you've set up HashiCorp Vault as an authentication service, you'll need to pass the `X-Ledger-Store-Auth-Token` header along with the API user header. For more details see [how to set up HashiCorp Vault with the LAM](https://help.vault.ledger.com/Content/api/hashicorp_vault.html).
      in: header
      name: X-Ledger-Store-Auth-Token
      type: apiKey
    defaultApiKey:
      type: apiKey
      name: x-api-key
      in: header
