    post:
      operationId: delegates_create_2
      description: >-
        Adds a new Safe delegate with a custom label. Calls with same delegate
        but different label or

        signer will update the label or delegator if a different one is
        provided.

        To generate the signature, the following EIP712 data hash needs to be
        signed:


        ```python
         {
            "types": {
                "EIP712Domain": [
                    {"name": "name", "type": "string"},
                    {"name": "version", "type": "string"},
                    {"name": "chainId", "type": "uint256"},
                ],
                "Delegate": [
                    {"name": "delegateAddress", "type": "address"},
                    {"name": "totp", "type": "uint256"},
                ],
            },
            "primaryType": "Delegate",
            "domain": {
                "name": "Safe Transaction Service",
                "version": "1.0",
                "chainId": chain_id,
            },
            "message": {
                "delegateAddress": delegate_address,
                "totp": totp,
            },
        }

        ```


        For the signature we use `TOTP` with `T0=0` and `Tx=3600`. `TOTP` is
        calculated by taking the

        Unix UTC epoch time (no milliseconds) and dividing by 3600 (natural
        division, no decimals).
      tags:
        - delegates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegateSerializerV2'
        required: true
      security:
        - cookieAuth: []
        - tokenAuth: []
        - {}
      responses:
        '202':
          description: Accepted
          x-gitbook-description-html: <p>Accepted</p>
        '400':
