  /api/v2/delegates/{delegate_address}/:
    delete:
      operationId: delegates_destroy_2
      description: >-
        Removes every delegate/delegator pair found associated with a given
        delegate address. The

        signature is built the same way as for adding a delegate, but in this
        case the signer can be

        either the `delegator` (owner) or the `delegate` itself. Check `POST
        /delegates/` to learn more.
      parameters:
        - in: path
          name: delegate_address
          schema:
            type: string
          required: true
      tags:
        - delegates
      security:
        - cookieAuth: []
        - tokenAuth: []
        - {}
      responses:
        '204':
          description: Deleted
          x-gitbook-description-html: <p>Deleted</p>
        '400':
          description: Malformed data
          x-gitbook-description-html: <p>Malformed data</p>
        '404':
          description: Delegate not found
          x-gitbook-description-html: <p>Delegate not found</p>
        '422':
