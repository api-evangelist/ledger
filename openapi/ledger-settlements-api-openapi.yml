openapi: 3.2.0
info:
  title: Vault Settlements API
  version: 1.35.0
  x-logo:
    url: https://www.ledger.com/wp-content/themes/ledger-v2/public/images/ledger-logo-long.svg
  description: '

    # Authentication


    The Ledger Vault API offers several methods of authentication.

    Depending on your LAM configuration you''ll require several of the following headers

    to process API calls. Please refer to the

    [help center](https://help.vault.ledger.com/Content/api/api_overview.html) for more details.


    The `X-Ledger-API-User` header is required for all API calls to LAM

    (except when you register

    [API users on LAM](https://help.vault.ledger.com/Content/api/api_apiusers.html)).


    Note that the `X-Ledger-API-Key` authorization header can be used alongside the

    `X-Ledger-Store-Auth-Token` if both a LAM API key and HashiCorp Vault have

    been set up on your LAM.

    In this case, for every call made to LAM,

    you''ll need to pass all three headers

    `X-Ledger-API-User`, `X-Ledger-API-Key`, and `X-Ledger-Store-Auth-Token`.

    '
security:
- Ledger_API_User: []
- Ledger_API_User: []
  Ledger_API_Key: []
- Ledger_API_User: []
  Ledger_Store_Auth_Token: []
- Ledger_API_User: []
  Ledger_API_Key: []
  Ledger_Store_Auth_Token: []
tags:
- name: Settlements
paths:
  /settlements:
    get:
      tags:
      - Settlements
      description: Search settlement
      parameters:
      - name: page
        in: query
        description: Defines the page number to be fetched.
        required: false
        schema:
          default: 1
          example: 3
          minimum: 1
          type:
          - integer
          - 'null'
      - name: page_size
        in: query
        description: Defines the number of elements displayed on a page. Must be a positive number with 0 and -1 being special values to return a maximum defined in the gate
        required: false
        schema:
          default: 20
          example: 40
          minimum: -1
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_APISearchPledgeResults'
          description: settlement search results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid search parameters
    post:
      summary: Create Settlement
      tags:
      - Settlements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlement'
        description: Settlement creation payload
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
          description: Settlement result
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request data
  /settlements/{settlement_id}:
    get:
      tags:
      - Settlements
      description: Get a settlement by id
      parameters:
      - name: settlement_id
        in: path
        description: settlement's id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
          description: settlement object
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Settlement not found
  /settlements/{settlement_id}/cancel:
    post:
      tags:
      - Settlements
      description: 'Cancel a settlement by id.

        Only Settlement with an outbound transaction in status `FAILED_TO_BROADCAST`

        can be canceled.

        Only Exchange (Liquidity Provider) user can cancel a settlement.

        '
      parameters:
      - name: settlement_id
        in: path
        description: settlement's id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
          description: settlement object
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Settlement cannot be canceled
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Settlement not found
  /settlements/{settlement_id}/recover:
    post:
      tags:
      - Settlements
      description: 'Used to accelerate on-chain confirmation of an Outbound Settlement transaction stuck pending in a mempool. This is only applicable to a settlement with an outbound transaction in status `SUBMITTED`. Only Exchange (Liquidity Provider) operators can recover a settlement and is only applicable to currencies supporting Replace by Fees (RBF) or Replace by Nonce (RBN).

        '
      parameters:
      - name: settlement_id
        in: path
        description: settlement's id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementRecoveryData'
        description: Settlement recovery payload
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
          description: settlement object
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Settlement cannot be recovered
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Settlement not found
components:
  schemas:
    SolanaCreateAssociatedTokenAccountTransactionData:
      properties:
        account_name:
          description: Sender account name for Solana transaction.
          example: Solana Wallet 1
          type: string
        currency:
          description: Account currency for Solana transactions.
          enum:
          - solana
          - solana_devnet
          - solana_testnet
          example: solana
        max_priority_fee:
          default: null
          description: Max priority fee to use for the transaction. Please refer to the `recommended_max_priority_fees` field from fee estimation or choose your own value. Once the feature is enabled, this field will become mandatory.
          example: '5000'
          type:
          - string
          - 'null'
        token_mint:
          description: The token mint address of the token to create an account for
          example: Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB
          type: string
      required:
      - account_name
      - currency
      - token_mint
      type: object
    EthereumFeesStrategy:
      properties:
        data:
          description: Data specific to the Ethereum fee strategy.
          oneOf:
          - $ref: '#/components/schemas/EthereumFeesStrategyData'
          - $ref: '#/components/schemas/EthereumEIP1559FeesStrategyData'
        type:
          description: Indicates a custom fee strategy for Ethereum transactions.
          enum:
          - CUSTOM
          example: CUSTOM
      required:
      - data
      - type
      type: object
