  /transactions:
    get:
      summary: Search Transaction
      tags:
      - transactions
      description: 'Use the following parameters to search transactions.


        Beware that default order is "desc", which can cause surprising

        result with pagination if transactions are being inserted.

        see [Pagination](#section/Introduction/Pagination) for more details

        '
      parameters:
      - name: account
        in: query
        description: Returns transactions created in the provided account.
        required: false
        explode: true
        schema:
          default: null
          items:
            type: integer
          type:
          - array
          - 'null'
        style: form
      - name: created_after
        in: query
        description: Returns objects created after the entered date.
        required: false
        schema:
          default: null
          example: '2020-09-12T14:15:22Z'
          format: date-time
          type:
          - string
          - 'null'
      - name: created_before
        in: query
        description: Returns objects created before the entered date.
        required: false
        schema:
          default: null
          example: '2020-12-13T16:17:28Z'
          format: date-time
          type:
          - string
          - 'null'
      - name: currency
        in: query
        description: Returns transactions created in the provided currency.
        required: false
        explode: true
        schema:
          default: null
          example: bitcoin or ethereum:0xdAC17F958D2ee523a2206206994597C13D831ec7
          items:
            type: string
          type:
          - array
          - 'null'
        style: form
      - name: destination_tag
        in: query
        description: Returns transactions that match the provided destination tag (XRP only).
        required: false
        schema:
          default: null
          type:
          - integer
          - 'null'
      - name: id
        in: query
        description: Returns the object corresponding to the entered ID
        required: false
        schema:
          default: null
          type:
          - integer
          - 'null'
      - name: interaction_type
        in: query
        description: Filters the list of results by interaction type.
        required: false
        schema:
          default: null
          enum:
          - null
          - APPROVAL
          - STAKE
          - SWAP
          - UNKNOWN
          - UNWRAP
          - WRAP
          type:
          - string
          - 'null'
      - name: label
        in: query
        description: Returns transactions whose note's title or content contain the provided label.This field is deprecated, please use the field `title` instead
        required: false
        schema:
          default: null
          type:
          - string
          - 'null'
        deprecated: true
      - name: max_amount
        in: query
        description: Returns objects that have the provided max amount.
        required: false
        schema:
          default: null
          pattern: ^[0-9]*(\.[0-9]+)?$
          type:
          - string
          - 'null'
      - name: memo
        in: query
        description: representation of the memo - an ascii, hex string or base 10 integer
        required: false
        schema:
          default: null
          type:
          - string
          - 'null'
      - name: min_amount
        in: query
        description: Returns objects that have the provided min amount.
        required: false
        schema:
          default: null
          pattern: ^[0-9]*(\.[0-9]+)?$
          type:
          - string
          - 'null'
      - name: order
        in: query
        description: Orders the list of results
        required: false
        schema:
          default: null
          enum:
          - null
          - asc
          - desc
          example: desc
          type:
          - string
          - 'null'
      - name: order_by
        in: query
        description: criteria to order by
        required: false
        schema:
          default: null
          example: name
          type:
          - string
          - 'null'
      - name: page
        in: query
        description: Defines the page number to be fetched.
        required: false
        schema:
          default: 1
          example: 3
          minimum: 1
          type:
          - integer
          - 'null'
      - name: page_size
        in: query
        description: "Defines the number of elements displayed on a page.\n        Must be a positive number with 0 and -1 return a maximum defined in the gate"
        required: false
        schema:
          default: 20
          example: 40
          minimum: -1
          type:
          - integer
          - 'null'
      - name: recipient
        in: query
        description: Filters the results on the provided recipient address.
        required: false
        schema:
          default: null
          type:
          - string
          - 'null'
      - name: status
        in: query
        description: Returns objects that match the selected status.
        required: false
        explode: true
        schema:
          default: null
          items:
            enum:
            - APPROVED
            - CONFIRMED
            - DROPPED
            - FAILED
            - FAILED_TO_BROADCAST
            - FAILED_TO_CRAFT
            - FAILED_TO_SIGN
            - PENDING_APPROVAL
            - PENDING_CREATE_IN_HSM
            - REJECTED
            - REPLACED
            - SIGNED
            - SUBMITTED
            type: string
          type:
          - array
          - 'null'
        style: form
      - name: title
        in: query
        description: Returns transactions whose note's title or content contain the provided label.
        required: false
        schema:
          default: null
          type:
          - string
          - 'null'
      - name: tx_hash
        in: query
        description: Returns transactions that match the provided transaction hash.
        required: false
        schema:
          default: null
          type:
          - string
          - 'null'
      - name: tx_label
        in: query
        description: Filters the list of results by transaction label id
        required: false
        explode: true
        schema:
          default: null
          items:
            type: string
          type:
          - array
          - 'null'
        style: form
      - name: type
        in: query
        description: Filters the list of results by transaction type.
        required: false
        schema:
          default: null
          enum:
          - null
          - ADDPROXY
          - ANONYMOUSPROXY
          - BOND
          - BONDEXTRA
          - CHILL
          - CREATE_SPL_TOKEN_ACCOUNT
          - DELEGATE
          - DELEGATE_VOTE_TO_DREP
          - DEPLOY_CONTRACT
          - EXECUTE_CONTRACT
          - KILLANONYMOUS
          - PROXY
          - REBOND
          - RECEIVE
          - RECEIVE_SPL_TOKEN_CHECKED
          - RECEIVE_SPL_TOKEN_CHECKED_FUNDED
          - REMOVEPROXY
          - REVEAL
          - REWARD
          - SEND
          - SEND_SPL_TOKEN_CHECKED
          - SEND_SPL_TOKEN_CHECKED_FUNDED
          - SETCONTROLLER
          - SETPAYEE
          - STAKE
          - STAKE_CREATE_DELEGATE
          - STAKE_DEACTIVATE
          - STAKE_DELEGATE
          - STAKE_MERGE
          - STAKE_SPLIT
          - STAKE_SPLIT_DEACTIVATE
          - STAKE_WITHDRAW
          - STAKING_DELEGATE
          - STAKING_DEREGISTER
          - STAKING_REGISTER
          - STAKING_WITHDRAW
          - UNBOND
          - UNDELEGATE
          - UNKNOWN
          - WITHDRAWUNBONDED
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_APISearchTransactionResults'
          description: Transaction search results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid search parameters
      security:
      - Ledger_API_User: []
      - Ledger_API_User: []
        Ledger_API_Key: []
      - Ledger_API_User: []
        Ledger_Store_Auth_Token: []
      - Ledger_API_User: []
        Ledger_API_Key: []
        Ledger_Store_Auth_Token: []
