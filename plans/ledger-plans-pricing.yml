note: >-
  Ledger publishes NO API pricing of any kind. www.ledger.com/pricing returns a real 404. Every API
  program in the estate is gated behind a commercial conversation rather than a published tier:
    - Ledger Enterprise is sold enterprise-direct — enterprise.ledger.com's calls to action are
      "Request a 30-minute meeting" and "Get started", and Ledger's own rate-limit page says limits
      are "specific to your API plan, please get in touch with your Account Manager", which confirms
      plans exist but are not published.
    - The Ledger Wallet exchange-provider APIs (swap/buy/sell/earn/card) are not a purchasable
      product at all: a provider implements Ledger's contract, submits its API, manifest and public
      key for Ledger review, and the commercial terms are negotiated in that partnership.
    - The developer surface itself (Device Management Kit, Wallet API, Clear Signing, Ledger Wallet
      Provider, agent skills, wallet-cli) is free and open-source; hardware is sold at retail via
      shop.ledger.com, which is device pricing rather than API pricing.
