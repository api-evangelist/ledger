    note: >-
      Ledger publishes the SIGNALLING but not the numbers: "Rate limits are specific to your API plan
      please get in touch with your Account Manager for more details." An agent can therefore react
      correctly at runtime but cannot budget in advance.
    response_headers:
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      - X-RateLimit-Reset
      - Retry-After
    exhaustion_status: 420
    exhaustion_note: >-
      Non-standard. Ledger returns HTTP 420 with rate-limitation details rather than the conventional
      429 Too Many Requests, so a generic client keying on 429 will not back off.
